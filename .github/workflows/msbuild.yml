name: MSBuild

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fpv4win source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Set up MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1.4.1

      - name: Bootstrap vcpkg
        run: |
          & .\vcpkg\bootstrap-vcpkg.bat
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

      # PCRE2 JIT is optional. The JIT-enabled port downloads SLJIT
      # metadata from GitHub API, which is failing in this workflow.
      # Disable this optional feature only in the temporary CI vcpkg copy.
      # Do NOT bypass SHA512 verification.
      - name: Disable optional PCRE2 JIT in CI
        run: |
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "vcpkg\ports\pcre2\vcpkg.json"
          if (-not (Test-Path $manifestPath)) {
            throw "PCRE2 vcpkg manifest not found"
          }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if (-not $manifest.features.'platform-default-features') {
            throw "Unexpected PCRE2 port features; inspect the port before changing it"
          }

          # Prevent JIT being selected either by defaults or by the
          # platform-default-features self-dependency.
          $manifest.'default-features' = @()
          $manifest.features.'platform-default-features'.dependencies = @()
          $manifest | ConvertTo-Json -Depth 30 | Set-Content -Path $manifestPath -Encoding utf8

          Write-Host "PCRE2 optional JIT disabled for this CI run"
          Write-Host "All vcpkg source SHA512 checks remain enabled"

      - name: Install dependencies including pkgconf
        run: |
          & .\vcpkg\vcpkg.exe install --triplet x64-windows libusb libpcap libsodium ffmpeg qt5 sdl2 vcpkg-tool-ninja pkgconf
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed"
          }

      - name: Configure CMake
        run: |
          $root = $env:GITHUB_WORKSPACE
          $toolchain = Join-Path $root "vcpkg\scripts\buildsystems\vcpkg.cmake"
          $pkgconf = Join-Path $root "vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe"
          $libPc = Join-Path $root "vcpkg\installed\x64-windows\lib\pkgconfig"
          $sharePc = Join-Path $root "vcpkg\installed\x64-windows\share\pkgconfig"

          if (-not (Test-Path $pkgconf)) {
            throw "pkgconf.exe not found: $pkgconf"
          }
          $env:PKG_CONFIG_PATH = "$libPc;$sharePc"
          & $pkgconf --version
          if ($LASTEXITCODE -ne 0) {
            throw "pkgconf is not working"
          }

          $toolchainCmake = $toolchain.Replace('\', '/')
          $pkgconfCmake = $pkgconf.Replace('\', '/')

          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchainCmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            "-DPKG_CONFIG_EXECUTABLE=$pkgconfCmake"
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Build fpv4win
        run: |
          cmake --build build --config Release --target fpv4win --parallel 2
          if ($LASTEXITCODE -ne 0) {
            throw "C++ build failed"
          }
          if (-not (Test-Path "build\Release\fpv4win.exe")) {
            throw "Build finished but fpv4win.exe was not found"
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpv4win-headless-test
          path: build/Release/
          if-no-files-found: error
