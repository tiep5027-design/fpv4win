name: MSBuild

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fpv4win source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Set up MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1.4.1

      - name: Bootstrap vcpkg
        run: |
          & .\vcpkg\bootstrap-vcpkg.bat
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

      # PCRE2's vcpkg port downloads a gitlink from api.github.com.
      # Prefetch it using the automatic GitHub Actions token to avoid
      # unauthenticated API rate limits on shared runners.
      - name: Prefetch PCRE2 SLJIT metadata with GitHub authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = $env:GITHUB_WORKSPACE
          $pcrePort = Join-Path $root "vcpkg\ports\pcre2\portfile.cmake"
          $pcreManifest = Join-Path $root "vcpkg\ports\pcre2\vcpkg.json"
          $version = (Get-Content $pcreManifest -Raw | ConvertFrom-Json).version
          $portContent = Get-Content $pcrePort -Raw

          # Read the trusted SHA512 digest from this precise vcpkg port.
          $match = [regex]::Match(
            $portContent,
            'set\(sljit_gitlink_hash SHA512 ([a-fA-F0-9]{128})\)'
          )
          if (-not $match.Success) {
            throw "PCRE2 port format changed; inspect portfile.cmake before proceeding"
          }
          $expectedSha512 = $match.Groups[1].Value.ToLowerInvariant()

          $downloadDir = Join-Path $root "vcpkg\downloads"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $fileName = "pcre2-pcre2-$version-sljit-gitlink.json"
          $destination = Join-Path $downloadDir $fileName
          $url = "https://api.github.com/repos/PCRE2Project/pcre2/contents/deps/sljit?ref=pcre2-$version"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "OpenIPC-fpv4win-CI"
          }

          Write-Host "Downloading authenticated PCRE2 submodule metadata for version $version"
          Invoke-WebRequest -Uri $url -Headers $headers -OutFile $destination -ErrorAction Stop

          $data = Get-Content $destination -Raw | ConvertFrom-Json
          if ($data.type -ne "submodule" -or
              $data.submodule_git_url -ne "https://github.com/zherczeg/sljit.git" -or
              $data.sha -notmatch '^[a-fA-F0-9]{40}$') {
            throw "Unexpected PCRE2 submodule metadata received"
          }

          $actualSha512 = (Get-FileHash -Path $destination -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actualSha512 -ne $expectedSha512) {
            Remove-Item $destination -Force
            throw "PCRE2 metadata hash differs from vcpkg portfile; do not bypass integrity verification"
          }

          Write-Host "PCRE2 metadata SHA512 verified and cached for vcpkg"

      - name: Install dependencies including pkgconf
        run: |
          & .\vcpkg\vcpkg.exe install --triplet x64-windows libusb libpcap libsodium ffmpeg qt5 sdl2 vcpkg-tool-ninja pkgconf
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed"
          }

      - name: Configure CMake
        run: |
          $root = $env:GITHUB_WORKSPACE
          $toolchain = Join-Path $root "vcpkg\scripts\buildsystems\vcpkg.cmake"
          $pkgconf = Join-Path $root "vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe"
          $libPc = Join-Path $root "vcpkg\installed\x64-windows\lib\pkgconfig"
          $sharePc = Join-Path $root "vcpkg\installed\x64-windows\share\pkgconfig"

          if (-not (Test-Path $pkgconf)) {
            throw "pkgconf.exe not found: $pkgconf"
          }

          $env:PKG_CONFIG_PATH = "$libPc;$sharePc"
          & $pkgconf --version
          if ($LASTEXITCODE -ne 0) {
            throw "pkgconf is not working"
          }

          $toolchainCmake = $toolchain.Replace('\', '/')
          $pkgconfCmake = $pkgconf.Replace('\', '/')

          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchainCmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            "-DPKG_CONFIG_EXECUTABLE=$pkgconfCmake"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Build fpv4win
        run: |
          cmake --build build --config Release --target fpv4win --parallel 2
          if ($LASTEXITCODE -ne 0) {
            throw "C++ build failed"
          }
          if (-not (Test-Path "build\Release\fpv4win.exe")) {
            throw "Build finished but fpv4win.exe was not found"
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpv4win-headless-test
          path: build/Release/
          if-no-files-found: error
